<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Monitor & ADAS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black h-screen flex items-center justify-center text-gray-300 font-mono">
    <div class="bg-gray-900 p-8 rounded shadow-2xl w-[28rem] border border-gray-700">
        <div class="border-b border-gray-700 pb-4 mb-6">
            <h1 class="text-xl font-bold tracking-widest text-blue-500">BAILADILA OPS // ADAS</h1>
            <p class="text-xs text-gray-500 mt-1 uppercase tracking-widest">Global Fleet Telemetry & Sensor Fusion Gateway</p>
            <p class="text-[10px] text-gray-600 mt-1">SYS_VER: 2.4.1 | SECURE CONNECTION ESTABLISHED</p>
        </div>
        
        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-gray-500 text-xs font-bold mb-2 uppercase tracking-widest">Authentication Role</label>
                <select name="role" id="role-select" class="w-full p-2 bg-black border border-gray-700 text-gray-300 focus:outline-none focus:border-blue-500 text-sm">
                    <option value="driver">VEHICLE OPERATOR (NODE)</option>
                    <option value="control">COMMAND CENTER (ADMIN)</option>
                </select>
            </div>
            
            <button type="submit" class="w-full bg-blue-900/50 border border-blue-500 text-blue-400 font-bold py-3 px-4 hover:bg-blue-800 hover:text-white transition uppercase tracking-widest text-sm">
                INITIALIZE SESSION
            </button>
        </form>
    </div>
</body>
</html>
